schema_version: 1

context:
  name: bioio-lif
  version: "3.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bioio_lif-${{ version }}.tar.gz
  sha256: e674ae84ce349212163a8c52c5b35fae83fb1237873d52eb4d02f0ad013d3e14

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - bioio-base >=3.0.0
    - dask-core >=2021.4.1
    - fsspec >=2022.8.0
    - liffile >=2026.2.16
    - numpy >=1.16
    - pyyaml >=6.0
    - xarray >=0.16.1

tests:
  - python:
      imports:
        - bioio_lif
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A BioIO reader plugin for reading LIF (Leica Image File) images.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/bioio-devs/bioio-lif

extra:
  recipe-maintainers:
    - imagejan
