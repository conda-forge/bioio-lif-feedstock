schema_version: 1

context:
  name: bioio-lif
  version: "2.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bioio_lif-${{ version }}.tar.gz
  sha256: f2d6d4ee980ea0853e5c03de20c692d21bc61a8c9b543329c91b2887cc4b7201

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - bioio-base >=3.0.0
    - dask-core >=2021.4.1
    - fsspec >=2022.8.0
    - liffile >=2026.2.16
    - numpy >=1.16
    - pyyaml >=6.0
    - xarray >=0.16.1

tests:
  - python:
      imports:
        - bioio_lif
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A BioIO reader plugin for reading LIF (Leica Image File) images.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/bioio-devs/bioio-lif

extra:
  recipe-maintainers:
    - imagejan
